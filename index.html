<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prize Lottery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- ============ Top bar ============ -->
    <header class="topbar">
      <div class="brand">
        <img class="logo" id="logo" alt="" hidden>
        <div>
          <h1 id="title"></h1>
          <p id="subtitle"></p>
        </div>
      </div>
      <div class="progress" id="progress"></div>
      <nav class="toolbar">
        <button class="icon-btn" id="btn-sound" title="Sound on/off (M)" aria-label="Toggle sound"></button>
        <button class="icon-btn" id="btn-fullscreen" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
        <button class="icon-btn" id="btn-settings" title="Data &amp; settings" aria-label="Settings">⚙</button>
        <button class="btn btn-ghost" id="btn-reset" title="Reset the lottery">Reset</button>
      </nav>
    </header>

    <!-- ============ Stage ============ -->
    <main class="stage">
      <section class="panel prize-panel" aria-live="polite">
        <div class="prize-card" id="prize-card">
          <div class="prize-rank" id="prize-rank"></div>
          <div class="prize-image"><img id="prize-image" alt=""></div>
          <h2 class="prize-name" id="prize-name"></h2>
          <p class="prize-desc" id="prize-desc"></p>
        </div>
        <div class="winner-slot" id="winner-slot">
          <span class="winner-label" data-text="winnerLabel"></span>
          <span class="winner-name" id="winner-name"></span>
        </div>
      </section>

      <section class="wheel-panel">
        <div class="wheel-wrap" id="wheel-wrap"><canvas id="wheel"></canvas></div>
        <div class="readout" id="readout"></div>
        <button class="btn btn-main" id="main-btn"></button>
        <div class="pool-info" id="pool-info"></div>
      </section>

      <aside class="panel results-panel">
        <h3 data-text="prizesHeading"></h3>
        <ol class="results-list" id="results-list"></ol>
      </aside>
    </main>
  </div>

  <!-- ============ Summary ============ -->
  <section class="summary" id="summary" hidden>
    <div class="summary-inner">
      <h2 data-text="summaryTitle"></h2>
      <div class="summary-grid" id="summary-grid"></div>
      <div class="summary-actions">
        <button class="btn" id="btn-export">Download CSV</button>
        <button class="btn" id="btn-print">Print</button>
        <button class="btn btn-ghost" id="btn-summary-close">Back to stage</button>
        <button class="btn btn-danger" id="btn-summary-reset">Reset lottery</button>
      </div>
    </div>
  </section>

  <!-- ============ Confirm dialog ============ -->
  <dialog class="dialog" id="confirm-dialog">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel">Cancel</button>
        <button class="btn btn-danger" value="ok" id="confirm-ok">Yes, reset</button>
      </div>
    </form>
  </dialog>

  <!-- ============ Settings dialog ============ -->
  <dialog class="dialog dialog-wide" id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h2>Data &amp; settings</h2>
      <p class="muted" id="data-status"></p>
      <ul class="warnings" id="data-warnings"></ul>

      <fieldset>
        <legend>Load your own data</legend>
        <label>Names CSV <small>(one name per row, UTF-8)</small>
          <input type="file" id="file-names" accept=".csv,.txt,text/csv">
        </label>
        <label>Prizes CSV <small>(columns: rank, name, image)</small>
          <input type="file" id="file-prizes" accept=".csv,.txt,text/csv">
        </label>
        <label>Prize images <small>(optional, select many; matched by file name from the image column)</small>
          <input type="file" id="file-images" accept="image/*" multiple>
        </label>
        <p class="muted">Templates: <a href="data/names.csv" download>names.csv</a> · <a href="data/prizes.csv" download>prizes.csv</a>. Loading new data resets the lottery.</p>
        <div class="dialog-actions left">
          <button class="btn" type="button" id="btn-load-files">Load files</button>
          <button class="btn btn-ghost" type="button" id="btn-demo-data">Restore demo data</button>
        </div>
        <p class="error" id="load-error"></p>
      </fieldset>

      <fieldset>
        <legend>Options</legend>
        <label class="row">Wheel style
          <select id="opt-style"></select>
        </label>
        <label class="row">Draw order
          <select id="opt-order">
            <option value="asc">Prize #1 first</option>
            <option value="desc">Highest number first, #1 last</option>
          </select>
        </label>
        <label class="row"><input type="checkbox" id="opt-sound"> Sound</label>
        <p class="muted" id="order-locked" hidden>Draw order can be changed only before the first draw (or after a reset).</p>
      </fieldset>

      <div class="dialog-actions">
        <button class="btn" value="close">Close</button>
      </div>
    </form>
  </dialog>

  <canvas class="confetti" id="confetti"></canvas>

  <!-- Plain scripts (no modules) so index.html also works when opened directly from disk. -->
  <script src="js/config.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
