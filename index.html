<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prize Lottery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script>
    // Load the active theme before first paint: ?theme=… in the URL > saved choice > config default.
    // Only that theme's stylesheet is loaded; switching later swaps it (see applyTheme in js/app.js).
    (function () {
      var cfg = window.LOTTERY_CONFIG, prefs = {};
      try { prefs = JSON.parse(localStorage.getItem(cfg.storageKey + ':prefs')) || {}; } catch (e) {}
      var q = new URLSearchParams(location.search);
      var theme = [q.get('theme'), prefs.theme, cfg.theme].filter(function (t) { return t && cfg.themes[t]; })[0];
      document.documentElement.dataset.theme = theme;
      document.write('<link rel="stylesheet" id="theme-css" href="' + window.lotteryThemeHref(theme) + '">');
    })();
  </script>
</head>
<body>
  <div class="app">
    <!-- ============ Top bar ============ -->
    <header class="topbar">
      <div class="brand">
        <img class="logo" id="logo" alt="" hidden>
        <div>
          <h1 data-i18n="title"></h1>
          <p data-i18n="subtitle"></p>
        </div>
      </div>
      <div class="progress" id="progress"></div>
      <nav class="toolbar">
        <select class="toolbar-select" id="theme-select" data-i18n-title="themeTip"></select>
        <button class="btn lang-switch" id="btn-lang" data-i18n-title="languageTip"></button>
        <button class="icon-btn" id="btn-sound" data-i18n-title="soundTip"></button>
        <button class="icon-btn" id="btn-fullscreen" data-i18n-title="fullscreenTip">⛶</button>
        <button class="icon-btn" id="btn-settings" data-i18n-title="settingsTip">⚙</button>
        <button class="btn btn-ghost" id="btn-reset" data-i18n="reset" data-i18n-title="resetTip"></button>
      </nav>
    </header>

    <!-- ============ Stage ============ -->
    <main class="stage">
      <section class="panel prize-panel" aria-live="polite">
        <div class="prize-card" id="prize-card">
          <div class="prize-rank tag" id="prize-rank"></div>
          <div class="prize-image"><img id="prize-image" alt=""></div>
          <h2 class="prize-name" id="prize-name"></h2>
          <p class="prize-desc" id="prize-desc"></p>
        </div>
        <div class="winner-slot" id="winner-slot">
          <span class="winner-label" data-i18n="winnerLabel"></span>
          <span class="winner-name" id="winner-name"></span>
        </div>
      </section>

      <section class="wheel-panel">
        <div class="wheel-wrap" id="wheel-wrap"><canvas id="wheel"></canvas></div>
        <div class="readout" id="readout"></div>
        <button class="btn btn-main" id="main-btn"></button>
        <div class="pool-info" id="pool-info"></div>
      </section>

      <aside class="panel results-panel">
        <h3 class="tag" data-i18n="prizesHeading"></h3>
        <ol class="results-list" id="results-list"></ol>
      </aside>
    </main>
  </div>

  <!-- ============ Summary ============ -->
  <section class="summary" id="summary" hidden>
    <div class="summary-inner">
      <img class="summary-logo" id="summary-logo" alt="" hidden>
      <span class="tag" data-i18n="summaryTag"></span>
      <h2 data-i18n="summaryTitle"></h2>
      <div class="summary-grid" id="summary-grid"></div>
      <div class="summary-actions">
        <button class="btn" id="btn-export" data-i18n="downloadCsv"></button>
        <button class="btn" id="btn-print" data-i18n="print"></button>
        <button class="btn btn-ghost" id="btn-summary-close" data-i18n="backToStage"></button>
        <button class="btn btn-danger" id="btn-summary-reset" data-i18n="resetLottery"></button>
      </div>
    </div>
  </section>

  <!-- ============ Confirm dialog ============ -->
  <dialog class="dialog" id="confirm-dialog">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel" data-i18n="cancel"></button>
        <button class="btn btn-danger" value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>

  <!-- ============ Settings dialog ============ -->
  <dialog class="dialog dialog-wide" id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h2 data-i18n="settingsTitle"></h2>
      <p class="muted" id="data-status"></p>
      <ul class="warnings" id="data-warnings"></ul>

      <fieldset>
        <legend data-i18n="loadOwnData"></legend>
        <label><span data-i18n="namesCsv"></span> <small data-i18n="namesHint"></small>
          <input type="file" id="file-names" accept=".csv,.txt,text/csv">
        </label>
        <label><span data-i18n="prizesCsv"></span> <small data-i18n="prizesHint"></small>
          <input type="file" id="file-prizes" accept=".csv,.txt,text/csv">
        </label>
        <label><span data-i18n="prizeImages"></span> <small data-i18n="imagesHint"></small>
          <input type="file" id="file-images" accept="image/*" multiple>
        </label>
        <p class="muted"><span data-i18n="templates"></span> <a href="data/names.csv" download>names.csv</a> · <a href="data/prizes.csv" download>prizes.csv</a>. <span data-i18n="loadingResets"></span></p>
        <div class="dialog-actions left">
          <button class="btn" type="button" id="btn-load-files" data-i18n="loadFiles"></button>
          <button class="btn btn-ghost" type="button" id="btn-demo-data" data-i18n="restoreDemo"></button>
        </div>
        <p class="error" id="load-error"></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="options"></legend>
        <label class="row"><span data-i18n="wheelStyle"></span>
          <select id="opt-style"></select>
        </label>
        <label class="row"><span data-i18n="drawOrder"></span>
          <select id="opt-order">
            <option value="asc" data-i18n="orderAsc"></option>
            <option value="desc" data-i18n="orderDesc"></option>
          </select>
        </label>
        <label class="row"><input type="checkbox" id="opt-sound"> <span data-i18n="sound"></span></label>
        <p class="muted" id="order-hint" data-i18n="orderResetHint" hidden></p>
      </fieldset>

      <div class="dialog-actions">
        <button class="btn" value="close" data-i18n="close"></button>
      </div>
    </form>
  </dialog>

  <canvas class="confetti" id="confetti"></canvas>

  <!-- Plain scripts (no modules) so index.html also works when opened directly from disk. -->
  <script src="js/i18n.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
